<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Signup Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
        }
        input {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #45a049;
        }
        #result {
            margin-top: 20px;
            padding: 10px;
            border-radius: 4px;
            word-wrap: break-word;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <h2>Signup Form</h2>

    <form id="signupForm">
        <input type="text" id="firstName" placeholder="First Name" required><br>
        <input type="text" id="lastName" placeholder="Last Name" required><br>
        <input type="text" id="userType" placeholder="User Type" required><br>
        <input type="email" id="email" placeholder="Email" required><br>
        <input type="password" id="password" placeholder="Password" required><br>
        <input type="password" id="confirmPassword" placeholder="Confirm Password" required><br>

        <button type="submit">Sign Up</button>
    </form>

    <p id="result"></p>

    <script>
        const form = document.getElementById("signupForm");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const data = {
                firstName: document.getElementById("firstName").value,
                lastName: document.getElementById("lastName").value,
                userType: document.getElementById("userType").value,
                email: document.getElementById("email").value,
                password: document.getElementById("password").value,
                confirmPassword: document.getElementById("confirmPassword").value
            };

            const resultElement = document.getElementById("result");
            resultElement.innerText = "Sending request...";
            resultElement.className = "";

            try {
                const response = await fetch("http://localhost:5000/auth/signUp", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                
                resultElement.className = response.ok ? "success" : "error";
                resultElement.innerText = 
                    "Status: " + response.status + "\n\n" + JSON.stringify(result, null, 2);

            } catch (err) {
                resultElement.className = "error";
                resultElement.innerText = "Error: " + err.message + 
                    "\n\nThis is likely a CORS issue. Check browser console (F12) for details." +
                    "\n\nMake sure your backend has CORS enabled.";
            }
        });
    </script>

</body>
</html>
